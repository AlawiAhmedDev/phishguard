[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phishguard"
version = "0.1.0"
description = "Machine-learning phishing URL detector with explanations; URLs are analysed as text and never visited"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alawi Masfar" }]
keywords = ["phishing", "security", "machine-learning", "url-classification", "explainable-ai"]
dependencies = [
    # pinned: the bundled model file was trained with this exact version
    "scikit-learn==1.7.2",
    "numpy>=1.24,<2.3",
    "pandas>=2.0",
    "joblib>=1.3",
    "tldextract>=5.1",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.7"]

[project.scripts]
phishguard = "phishguard.cli:main"

[tool.setuptools]
packages = ["phishguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
