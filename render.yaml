services:
  - type: web
    name: phishguard
    runtime: python
    plan: free
    buildCommand: pip install -e . gunicorn
    startCommand: gunicorn "phishguard.app:create_app()" --bind 0.0.0.0:$PORT --workers 1 --timeout 60
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
